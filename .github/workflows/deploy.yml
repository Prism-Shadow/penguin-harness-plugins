name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: the published index is what
# every harness reads.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publish index.json
    runs-on: ubuntu-latest
    if: github.repository == 'Prism-Shadow/penguin-harness-plugins'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Nothing a released harness would not accept replaces the published index: a harness
      # refuses the whole document over one row (see the CI workflow and src/harness-readers.ts).
      # Released readers only: they are what deployments run. Harness `main` is checked on pull
      # requests (ci.yml), so an unreleased reader change can never stop the index publishing.
      - name: Check the index against every released harness reader
        run: pnpm check-harness

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
